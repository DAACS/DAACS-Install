services:
  #shibreset_service_name:
    command: >
        /bin/sh -c "cd /usr/src/app && npm run-script start-dev"
    expose:
      - 80
      - 443
    restart: unless-stopped
    networks:
      - myNetwork
    env_file: 
      - ${ENV_DIR}sso-reset
      - ${ENV_DIR_TO_LDAP}ldap
    environment:
      - BIND_DN=cn=admin,$OPENLDAP_BOOTSTRAP_SUFFIX
      - SEARCH_DN=$LDAP_ROOT,$OPENLDAP_BOOTSTRAP_SUFFIX
    volumes:
      - "${FOLDER_START}:/usr/src/app"
    image: node

networks:
  myNetwork:
    external: true
