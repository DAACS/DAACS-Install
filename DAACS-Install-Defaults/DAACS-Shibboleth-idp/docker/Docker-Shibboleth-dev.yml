services:
  #shibboleth_service_name:
    expose:
      - 80
      - 443
    restart: unless-stopped
    networks:
      - myNetwork
    env_file: 
      - ${ENV_DIR}shibboleth
      - ${ENV_LDAP_DIR}ldap
    environment:
      - ENV_LDAP_RESTART_VIRTUAL_HOST=$ENV_LDAP_RESTART_VIRTUAL_HOST
    image: shibbolethreal

networks:
  myNetwork:
    external: true
