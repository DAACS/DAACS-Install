services:
  #redis_service_name:
    image: redis:latest
    container_name: ${REDIS_CONTAINER_NAME}
    restart: unless-stopped
    env_file: 
      - ${ENV_DIR}redis
    networks:
      - myNetwork
    ports:
      - "${REDIS_MAPPED_PORT}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly no
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    driver: local

networks:
  myNetwork:
    external: true

  #    --tls \
  # --cacert /etc/redis/tls/ca.crt \
  # --cert /etc/redis/tls/client.crt \
  # --key /etc/redis/tls/client.key \
  # -h your-redis-host -p 6379